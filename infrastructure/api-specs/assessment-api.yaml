openapi: "3.0.3"
info:
  title: DOTLearn Academy - Assessment Service
  version: "1.0.0"
  description: "Handles quiz creation, attempt management, server-side timer enforcement and auto-grading."

servers:
  - url: http://localhost:5006
    description: Local development
  - url: https://api.dotlearnacademy.com/assessments
    description: Production

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      $ref: './common.yaml#/components/securitySchemes/BearerAuth'

  schemas:
    QuestionRequest:
      type: object
      required: [text, type, options, correctAnswers, marks]
      properties:
        text:
          type: string
          example: "What is dependency injection?"
        type:
          type: string
          enum: [SingleChoice, MultipleChoice, TrueFalse]
          example: "SingleChoice"
        options:
          type: array
          items:
            type: string
          example: ["A design pattern", "A database", "A framework", "A cloud service"]
        correctAnswers:
          type: array
          items:
            type: integer
          description: "Zero-based indexes of correct options"
          example: [0]
        marks:
          type: integer
          example: 2

    CreateQuizRequest:
      type: object
      required: [courseId, title, passingScore, maxAttempts, questions]
      properties:
        courseId:
          type: string
          example: "crs_xyz789"
        title:
          type: string
          example: "Module 1 Quiz"
        timeLimitMinutes:
          type: integer
          example: 30
          nullable: true
        passingScore:
          type: integer
          description: "Passing percentage (0-100)"
          example: 70
        maxAttempts:
          type: integer
          example: 3
        questions:
          type: array
          items:
            $ref: '#/components/schemas/QuestionRequest'

    QuizResponse:
      type: object
      properties:
        id:
          type: string
          example: "quz_abc123"
        courseId:
          type: string
        title:
          type: string
        timeLimitMinutes:
          type: integer
          nullable: true
        passingScore:
          type: integer
        maxAttempts:
          type: integer
        totalMarks:
          type: integer
          example: 20
        questionCount:
          type: integer
          example: 10

    StartAttemptResponse:
      type: object
      properties:
        attemptId:
          type: string
          example: "att_abc123"
        quizId:
          type: string
        startedAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          nullable: true
        questions:
          type: array
          description: "Options shuffled — correctAnswers NOT included"
          items:
            type: object
            properties:
              id:
                type: string
              text:
                type: string
              type:
                type: string
              options:
                type: array
                items:
                  type: string
              marks:
                type: integer

    SubmitAnswersRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: object
          description: "Map of questionId to array of selected option indexes"
          example:
            "q_001": [0]
            "q_002": [1, 3]

    AttemptResult:
      type: object
      properties:
        attemptId:
          type: string
        quizId:
          type: string
        studentId:
          type: string
        score:
          type: integer
          example: 14
        totalMarks:
          type: integer
          example: 20
        percentage:
          type: number
          example: 70.0
        passed:
          type: boolean
          example: true
        timeTakenSeconds:
          type: integer
          example: 840
        submittedAt:
          type: string
          format: date-time
        breakdown:
          type: array
          description: "Per question result — correct answer revealed after submission"
          items:
            type: object
            properties:
              questionId:
                type: string
              yourAnswer:
                type: array
                items:
                  type: integer
              correctAnswer:
                type: array
                items:
                  type: integer
              isCorrect:
                type: boolean
              marksEarned:
                type: integer

paths:

  /quizzes:
    post:
      summary: Create a quiz (Instructor — own course only)
      tags: [Quizzes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateQuizRequest'
      responses:
        "201":
          description: Quiz created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizResponse'
        "403":
          description: Not your course
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/ErrorResponse'

  /quizzes/{id}:
    get:
      summary: Get quiz details
      tags: [Quizzes]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Quiz info (no correct answers)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuizResponse'

  /quizzes/{id}/attempts/start:
    post:
      summary: Start a quiz attempt (enrolled students only)
      tags: [Attempts]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: Attempt started — questions returned without correct answers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartAttemptResponse'
        "400":
          description: Max attempts exceeded
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/ErrorResponse'

  /quizzes/{id}/attempts/{attemptId}/submit:
    post:
      summary: Submit quiz answers
      tags: [Attempts]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: attemptId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitAnswersRequest'
      responses:
        "200":
          description: Auto-graded result with per-question breakdown
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttemptResult'

  /quizzes/{id}/attempts/student/{studentId}:
    get:
      summary: Get attempt history for a student
      tags: [Attempts]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: studentId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of all attempts with scores
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttemptResult'
