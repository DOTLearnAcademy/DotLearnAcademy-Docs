openapi: "3.0.3"
info:
  title: DOTLearn Academy - Payment Service
  version: "1.0.0"
  description: "Handles Razorpay/Stripe checkout, webhook processing, idempotency, refunds and payment history."

servers:
  - url: http://localhost:5004
    description: Local development
  - url: https://api.dotlearnacademy.com/payments
    description: Production

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      $ref: './common.yaml#/components/securitySchemes/BearerAuth'

  schemas:
    CheckoutRequest:
      type: object
      required: [courseId, gateway]
      properties:
        courseId:
          type: string
          example: "crs_xyz789"
        gateway:
          type: string
          enum: [razorpay, stripe]
          example: "razorpay"

    CheckoutResponse:
      type: object
      properties:
        orderId:
          type: string
          description: "Razorpay order ID or Stripe PaymentIntent ID"
          example: "order_abc123"
        amount:
          type: number
          example: 99900
          description: "Amount in paise (Razorpay) or cents (Stripe)"
        currency:
          type: string
          example: "INR"
        gateway:
          type: string
          example: "razorpay"
        keyId:
          type: string
          description: "Razorpay key_id or Stripe publishable key for frontend SDK"
          example: "rzp_test_abc123"

    WebhookPayload:
      type: object
      description: "Raw webhook body from Razorpay or Stripe — validated by signature"
      properties:
        event:
          type: string
          example: "payment.captured"
        payload:
          type: object

    PaymentRecord:
      type: object
      properties:
        id:
          type: string
          example: "pay_abc123"
        studentId:
          type: string
          example: "usr_abc123"
        courseId:
          type: string
          example: "crs_xyz789"
        amount:
          type: number
          example: 999.00
        currency:
          type: string
          example: "INR"
        gateway:
          type: string
          enum: [razorpay, stripe]
        transactionId:
          type: string
          example: "rzp_pay_abc123"
        status:
          type: string
          enum: [Pending, Completed, Failed, Refunded]
        createdAt:
          type: string
          format: date-time

    RefundRequest:
      type: object
      required: [paymentId, reason]
      properties:
        paymentId:
          type: string
          example: "pay_abc123"
        reason:
          type: string
          example: "Student requested refund within 30 days"

paths:

  /checkout:
    post:
      summary: Initiate course checkout
      tags: [Payments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        "200":
          description: Order created — use orderId in frontend SDK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutResponse'
        "400":
          description: Invalid course or already enrolled
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/ErrorResponse'

  /webhook/razorpay:
    post:
      summary: Razorpay webhook handler
      security: []
      tags: [Webhooks]
      description: "Signature verified via X-Razorpay-Signature header before processing"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookPayload'
      responses:
        "200":
          description: Webhook processed
        "400":
          description: Invalid signature
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/ErrorResponse'

  /webhook/stripe:
    post:
      summary: Stripe webhook handler
      security: []
      tags: [Webhooks]
      description: "Signature verified via Stripe-Signature header before processing"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookPayload'
      responses:
        "200":
          description: Webhook processed
        "400":
          description: Invalid signature
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/ErrorResponse'

  /refund:
    post:
      summary: Issue refund (Admin only)
      tags: [Payments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefundRequest'
      responses:
        "200":
          description: Refund issued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRecord'
        "403":
          description: Admin only
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/ErrorResponse'

  /student/{studentId}:
    get:
      summary: Get payment history for a student
      tags: [Payments]
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated payment history
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PaymentRecord'
                  page:
                    type: integer
                  totalCount:
                    type: integer
