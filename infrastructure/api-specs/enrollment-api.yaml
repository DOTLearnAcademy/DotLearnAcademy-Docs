openapi: "3.0.3"
info:
  title: DOTLearn Academy - Enrollment Service
  version: "1.0.0"
  description: "Handles enrollment lifecycle, free enrollment, SQS consumer for PaymentSucceeded, progress aggregation and certificate trigger."

servers:
  - url: http://localhost:5005
    description: Local development
  - url: https://api.dotlearnacademy.com/enrollments
    description: Production

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      $ref: './common.yaml#/components/securitySchemes/BearerAuth'

  schemas:
    EnrollFreeRequest:
      type: object
      required: [courseId]
      properties:
        courseId:
          type: string
          example: "crs_xyz789"

    EnrollmentRecord:
      type: object
      properties:
        id:
          type: string
          example: "enr_abc123"
        studentId:
          type: string
          example: "usr_abc123"
        courseId:
          type: string
          example: "crs_xyz789"
        status:
          type: string
          enum: [Active, Completed, Revoked]
          example: "Active"
        progressPercent:
          type: number
          example: 45.5
        certificateIssued:
          type: boolean
          example: false
        enrolledAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
          nullable: true

    EnrollmentListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/EnrollmentRecord'
        page:
          type: integer
        pageSize:
          type: integer
        totalCount:
          type: integer
        totalPages:
          type: integer

    IsEnrolledResponse:
      type: object
      properties:
        isEnrolled:
          type: boolean
          example: true
        enrollmentId:
          type: string
          example: "enr_abc123"
        status:
          type: string
          enum: [Active, Completed, Revoked]

paths:

  /enrollments/free:
    post:
      summary: Enroll in a free course (Student only)
      tags: [Enrollments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollFreeRequest'
      responses:
        "201":
          description: Enrolled successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentRecord'
        "400":
          description: Course is not free or already enrolled
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/ErrorResponse'

  /enrollments/student/{studentId}:
    get:
      summary: Get all enrollments for a student
      tags: [Enrollments]
      parameters:
        - name: studentId
          in: path
          required: true
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [Active, Completed, Revoked]
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated enrollment list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentListResponse'
        "403":
          description: Cannot view another student's enrollments
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/ErrorResponse'

  /enrollments/{id}:
    get:
      summary: Get single enrollment details
      tags: [Enrollments]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Enrollment details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentRecord'
        "404":
          description: Enrollment not found
          content:
            application/json:
              schema:
                $ref: './common.yaml#/components/schemas/ErrorResponse'

  /internal/enrollments/check:
    get:
      summary: "INTERNAL — Check if student is enrolled in a course (called by Lesson Service)"
      tags: [Internal]
      parameters:
        - name: studentId
          in: query
          required: true
          schema:
            type: string
        - name: courseId
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Enrollment status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IsEnrolledResponse'

  /internal/enrollments/{id}/progress-update:
    post:
      summary: "INTERNAL — Update progress percent (called by Progress Service)"
      tags: [Internal]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [progressPercent]
              properties:
                progressPercent:
                  type: number
                  example: 85.0
      responses:
        "200":
          description: Progress updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentRecord'
